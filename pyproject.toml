[tool.poetry]
name = "pcc-research"
version = "0.0.1"
description = ""
authors = ["Dhinak G"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
asn1 = "^2.8.0"
betterproto = {extras = ["compiler"], version = "^2.0.0b7", allow-prereleases = true}
requests = "^2.32.3"
rich = "^13.9.4"
protobuf = "^5.29.3"
natsort = "^8.4.0"
pyimg4 = "^0.8.7"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.1.2"
pylint = "^3.3.4"
black = "^25.1.0"
isort = "^5.13.2"
ruff = "^0.9.9"


[tool.isort]
profile = "black"
line_length = 140

[tool.black]
line-length = 140

[tool.pylint.MASTER]
init-hook = "import os, sys; sys.path.append(os.path.dirname('.'))"

[tool.pylint.format]
max-line-length = "140"

[tool.pylint.'MESSAGES CONTROL']
disable = "logging-fstring-interpolation, missing-function-docstring, no-else-return"

# If ruff is your fancy. I haven't completely tested it yet though
[tool.ruff]
select = ["E", "F", "W"]
ignore = []
line-length = 140

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
